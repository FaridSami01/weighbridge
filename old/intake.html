{% extends "base.html" %}
{% block content %}

<style>
/* Enhanced Intake Form Styling */
.intake-container {
    max-width: 1200px;
    margin: 0 auto;
}

.weighbridge-display {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    text-align: center;
}

.weight-reading {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
}

.weight-value {
    font-size: 72px;
    font-weight: bold;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 10px rgba(0,255,0,0.5);
    background: #000;
    padding: 20px 40px;
    border-radius: 10px;
    border: 3px solid #00ff00;
    min-width: 300px;
}

.weight-unit {
    font-size: 48px;
    color: #00ff00;
    font-weight: bold;
}

.status-indicator {
    display: inline-block;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 2s infinite;
}

.status-online {
    background: #00ff00;
    box-shadow: 0 0 10px #00ff00;
}

.status-offline {
    background: #ff0000;
    box-shadow: 0 0 10px #ff0000;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.weighbridge-title {
    color: #fff;
    font-size: 24px;
    margin-bottom: 10px;
}

.weighbridge-status {
    color: #fff;
    font-size: 14px;
    opacity: 0.8;
}

.intake-form-container {
    background: #fff;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.form-header {
    background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    color: white;
    padding: 20px;
    border-radius: 8px 8px 0 0;
    margin: -30px -30px 30px -30px;
    text-align: center;
}

.form-header h2 {
    margin: 0;
    font-size: 28px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-weight: 600;
    margin-bottom: 8px;
    color: #2c3e50;
    font-size: 14px;
}

.form-group input,
.form-group select {
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    font-size: 16px;
    transition: border-color 0.3s;
    background: #fff;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #3498db;
}

.form-group input[readonly] {
    background: #f8f9fa;
    cursor: not-allowed;
}

.weight-display-field {
    font-size: 24px;
    font-weight: bold;
    color: #27ae60;
    text-align: center;
    background: #e8f8f5 !important;
}

.action-buttons {
    display: flex;
    gap: 15px;
    margin-top: 30px;
    justify-content: center;
}

.btn {
    padding: 15px 40px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.btn-capture {
    background: #27ae60;
    color: white;
}

.btn-capture:hover {
    background: #229954;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.btn-save {
    background: #3498db;
    color: white;
}

.btn-save:hover {
    background: #2980b9;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.btn-clear {
    background: #e74c3c;
    color: white;
}

.btn-clear:hover {
    background: #c0392b;
}

.btn-load {
    background: #9b59b6;
    color: white;
}

.btn-load:hover {
    background: #8e44ad;
}

.record-number {
    text-align: center;
    margin-bottom: 20px;
    font-size: 18px;
    color: #7f8c8d;
}

.alert {
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 20px;
}

.alert-success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.alert-error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.saved-templates {
    margin-bottom: 20px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 6px;
}

.saved-templates select {
    padding: 10px;
    width: 100%;
    border: 2px solid #3498db;
    border-radius: 6px;
}

/* Editable field indicator */
.editable {
    border-left: 4px solid #3498db !important;
}
</style>

<div class="intake-container">
    <h1 style="text-align: center; margin-bottom: 30px;">{{ t.wheat_intake }}</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <!-- Live Weighbridge Display -->
    <div class="weighbridge-display">
        <div class="weighbridge-title">
            <span class="status-indicator" id="statusIndicator"></span>
            {{ t.live_weighbridge }}
        </div>
        <div class="weight-reading">
            <div class="weight-value" id="liveWeight">0</div>
            <div class="weight-unit">{{ t.kg }}</div>
        </div>
        <div class="weighbridge-status" id="statusText">{{ t.offline }}</div>
    </div>

    <!-- Load Saved Template -->
    <div class="saved-templates">
        <label><strong>📋 Load Saved Template:</strong></label>
        <select id="templateSelector" onchange="loadTemplate()">
            <option value="">-- Select Template to Auto-Fill --</option>
            <option value="last">Last Entry</option>
            <option value="custom1">Custom Template 1</option>
            <option value="custom2">Custom Template 2</option>
        </select>
    </div>

    <!-- Intake Form -->
    <div class="intake-form-container">
        <div class="form-header">
            <h2>{{ t.mill_name_ar }}</h2>
            <p style="margin: 5px 0 0 0; font-size: 16px;">{{ t.wheat_intake }}</p>
        </div>

        <form method="POST" id="intakeForm">
            <!-- Record Number -->
            <div class="record-number">
                <strong>{{ t.intake }} #:</strong> <span id="recordNumber">---</span>
            </div>

            <div class="form-row">
                <!-- Left Column -->
                <div>
                    <!-- Client Name / Vendor - FREE INPUT WITH SUGGESTIONS -->
                    <div class="form-group">
                        <label>اسم العميل / {{ t.vendor }} *</label>
                        <input type="text" name="vendor_name" id="vendor_name" list="vendorList" 
                               class="editable" placeholder="Enter or select vendor" required>
                        <datalist id="vendorList">
                            {% for v in vendors %}
                            <option value="{{ v.name }}">{{ v.name }}</option>
                            {% endfor %}
                        </datalist>
                    </div>

                    <!-- Type - FREE INPUT -->
                    <div class="form-group">
                        <label>النوع / Type</label>
                        <input type="text" name="wheat_type" id="wheat_type" 
                               class="editable" placeholder="e.g., جديد, قديم, مخلوط">
                    </div>

                    <!-- Carrier Name - FREE INPUT -->
                    <div class="form-group">
                        <label>اسم الناقل / Carrier</label>
                        <input type="text" name="carrier_name" id="carrier_name" 
                               class="editable" placeholder="Carrier name">
                    </div>
                </div>

                <!-- Right Column -->
                <div>
                    <!-- Vehicle Number - FREE INPUT -->
                    <div class="form-group">
                        <label>رقم السيارة / {{ t.truck_number }} *</label>
                        <input type="text" name="truck" id="truck" 
                               class="editable" placeholder="e.g., 122, ABC-123" required>
                    </div>

                    <!-- Governorate - FREE INPUT -->
                    <div class="form-group">
                        <label>المحافظة / Governorate</label>
                        <input type="text" name="governorate" id="governorate" 
                               class="editable" placeholder="e.g., Cairo, Giza">
                    </div>

                    <!-- Load Type - FREE INPUT -->
                    <div class="form-group">
                        <label>الحمولة / Load</label>
                        <input type="text" name="load_type" id="load_type" 
                               class="editable" placeholder="e.g., Full, Partial">
                    </div>

                    <!-- Previous / Driver - FREE INPUT -->
                    <div class="form-group">
                        <label>السايق / Driver</label>
                        <input type="text" name="driver" id="driver" 
                               class="editable" placeholder="Driver name">
                    </div>
                </div>
            </div>

            <!-- Weight Section - READ ONLY (AUTO-FILLED) -->
            <div class="form-row">
                <div class="form-group">
                    <label>قيمة الوزن / {{ t.gross_weight }} ({{ t.kg }}) - AUTO</label>
                    <input type="number" name="gross" id="gross" class="weight-display-field" 
                           readonly value="0" required>
                </div>

                <div class="form-group">
                    <label>الوزنة الاولى / First Weight - AUTO</label>
                    <input type="number" name="first_weight" id="first_weight" 
                           class="weight-display-field" readonly value="0">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button type="button" class="btn btn-capture" onclick="captureWeight()">
                    ⚖️ Capture Weight
                </button>
                <button type="submit" class="btn btn-save">
                    💾 {{ t.save }}
                </button>
                <button type="button" class="btn btn-load" onclick="saveAsTemplate()">
                    📝 Save as Template
                </button>
                <button type="button" class="btn btn-clear" onclick="clearForm()">
                    🗑️ Clear Form
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let currentWeight = 0;
let isOnline = false;

// Fetch live weight every second
function updateWeight() {
    fetch("/api/weighbridge")
        .then(r => r.json())
        .then(data => {
            currentWeight = data.weight;
            isOnline = data.online;
            
            document.getElementById("liveWeight").innerText = currentWeight;
            
            const indicator = document.getElementById("statusIndicator");
            const statusText = document.getElementById("statusText");
            
            if (isOnline) {
                indicator.className = "status-indicator status-online";
                statusText.innerText = "{{ t.online }}";
            } else {
                indicator.className = "status-indicator status-offline";
                statusText.innerText = "{{ t.offline }}" + (data.demo_mode ? " (Demo Mode)" : "");
            }
        })
        .catch(err => console.error("Weighbridge error:", err));
}

// Capture weight to form
function captureWeight() {
    if (currentWeight > 0) {
        document.getElementById("gross").value = currentWeight;
        document.getElementById("first_weight").value = currentWeight;
        
        const captureBtn = event.target;
        captureBtn.innerText = "✅ Weight Captured!";
        captureBtn.style.background = "#27ae60";
        
        setTimeout(() => {
            captureBtn.innerText = "⚖️ Capture Weight";
            captureBtn.style.background = "";
        }, 2000);
    } else {
        alert("No weight detected! Place vehicle on scale.");
    }
}

// Save current form as template
function saveAsTemplate() {
    const formData = {
        vendor_name: document.getElementById("vendor_name").value,
        wheat_type: document.getElementById("wheat_type").value,
        carrier_name: document.getElementById("carrier_name").value,
        truck: document.getElementById("truck").value,
        governorate: document.getElementById("governorate").value,
        load_type: document.getElementById("load_type").value,
        driver: document.getElementById("driver").value
    };
    
    localStorage.setItem('last_intake_template', JSON.stringify(formData));
    alert("✅ Template saved! Select 'Last Entry' to load it next time.");
}

// Load saved template
function loadTemplate() {
    const templateType = document.getElementById("templateSelector").value;
    
    if (templateType === 'last') {
        const saved = localStorage.getItem('last_intake_template');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById("vendor_name").value = data.vendor_name || '';
            document.getElementById("wheat_type").value = data.wheat_type || '';
            document.getElementById("carrier_name").value = data.carrier_name || '';
            document.getElementById("truck").value = data.truck || '';
            document.getElementById("governorate").value = data.governorate || '';
            document.getElementById("load_type").value = data.load_type || '';
            document.getElementById("driver").value = data.driver || '';
            alert("✅ Template loaded!");
        } else {
            alert("No saved template found.");
        }
    }
}

// Clear form
function clearForm() {
    if (confirm("Clear all fields?")) {
        document.getElementById("intakeForm").reset();
        document.getElementById("gross").value = "0";
        document.getElementById("first_weight").value = "0";
    }
}

// Auto-save form data before submission
document.getElementById("intakeForm").addEventListener("submit", function() {
    saveAsTemplate(); // Auto-save on submit
});

// Update weight every second
setInterval(updateWeight, 1000);
updateWeight();

// Generate record number
fetch("/api/next-intake-number")
    .then(r => r.json())
    .then(data => {
        document.getElementById("recordNumber").innerText = data.next_number || "---";
    })
    .catch(() => {
        document.getElementById("recordNumber").innerText = "---";
    });
</script>

{% endblock %}
