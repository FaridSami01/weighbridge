{% extends "base.html" %}
{% block content %}
<style>
.packing-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.scale-display {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.scale-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 20px;
}

.scale-value {
    text-align: center;
}

.scale-label {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 5px;
}

.scale-number {
    font-size: 48px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}

.scale-unit {
    font-size: 20px;
    opacity: 0.8;
    margin-left: 5px;
}

.status-badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
}

.status-online {
    background: #d4edda;
    color: #155724;
}

.status-offline {
    background: #f8d7da;
    color: #721c24;
}

.form-section {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #667eea;
}

.form-group input[readonly] {
    background: #f5f5f5;
    color: #666;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
}

.btn-secondary {
    background: #6c757d;
    color: white;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
}

.btn-secondary:hover {
    background: #5a6268;
}

.quick-products {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.quick-product-btn {
    padding: 10px 20px;
    border: 2px solid #667eea;
    background: white;
    color: #667eea;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
}

.quick-product-btn:hover,
.quick-product-btn.active {
    background: #667eea;
    color: white;
}

/* RTL Support for Arabic */
[dir="rtl"] .form-group label {
    text-align: right;
}

[dir="rtl"] .scale-unit {
    margin-left: 0;
    margin-right: 5px;
}
</style>

<div class="packing-container">
    <h1>📦 {{ t.packing_production }}</h1>
    
    <!-- Live Scale Display -->
    <div class="scale-display">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">🎯 {{ t.live_packing_scale }}</h2>
            <span class="status-badge" id="scaleStatus">
                ⏳ {{ t.checking }}...
            </span>
        </div>
        
        <div class="scale-grid">
            <div class="scale-value">
                <div class="scale-label">{{ t.bag_weight }}</div>
                <div>
                    <span class="scale-number" id="bagWeight">--</span>
                    <span class="scale-unit">{{ t.kg }}</span>
                </div>
            </div>
            
            <div class="scale-value">
                <div class="scale-label">{{ t.bag_count }}</div>
                <div>
                    <span class="scale-number" id="bagCount">--</span>
                    <span class="scale-unit">{{ t.bags }}</span>
                </div>
            </div>
            
            <div class="scale-value">
                <div class="scale-label">{{ t.total_weight }}</div>
                <div>
                    <span class="scale-number" id="totalWeight">--</span>
                    <span class="scale-unit">{{ t.kg }}</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Packing Form -->
    <div class="form-section">
        <h2>📋 {{ t.record_production }}</h2>
        
        <form id="packingForm" onsubmit="submitPacking(event)">
            <div class="form-grid">
                <!-- Product Type -->
                <div class="form-group">
                    <label>{{ t.product_type }} *</label>
                    <select id="productType" name="product_type" required>
                        <option value="">{{ t.select_product }}...</option>
                        <option value="Flour 72%">{{ t.flour_72 }}</option>
                        <option value="Flour 82%">{{ t.flour_82 }}</option>
                        <option value="Semolina">{{ t.semolina }}</option>
                        <option value="Bran">{{ t.bran }}</option>
                        <option value="Fine Bran">{{ t.fine_bran }}</option>
                        <option value="Coarse Bran">{{ t.coarse_bran }}</option>
                    </select>
                    
                    <!-- Quick select buttons -->
                    <div class="quick-products">
                        <button type="button" class="quick-product-btn" onclick="selectProduct('Flour 72%')">{{ t.flour_72 }}</button>
                        <button type="button" class="quick-product-btn" onclick="selectProduct('Flour 82%')">{{ t.flour_82 }}</button>
                        <button type="button" class="quick-product-btn" onclick="selectProduct('Bran')">{{ t.bran }}</button>
                    </div>
                </div>
                
                <!-- Bag Weight -->
                <div class="form-group">
                    <label>{{ t.bag_weight }} ({{ t.kg }}) *</label>
                    <input type="number" id="bagWeightInput" name="bag_weight" 
                           step="0.1" min="0" readonly 
                           placeholder="{{ t.auto_captured }}">
                </div>
                
                <!-- Bag Count -->
                <div class="form-group">
                    <label>{{ t.bag_count }} *</label>
                    <input type="number" id="bagCountInput" name="bag_count" 
                           min="0" readonly 
                           placeholder="{{ t.auto_captured }}">
                </div>
                
                <!-- Total Weight -->
                <div class="form-group">
                    <label>{{ t.total_weight }} ({{ t.kg }})</label>
                    <input type="number" id="totalWeightInput" name="total_weight" 
                           step="0.1" min="0" readonly 
                           placeholder="{{ t.calculated_auto }}">
                </div>
                
                <!-- Production Line - ONLY 2 LINES -->
                <div class="form-group">
                    <label>{{ t.production_line }}</label>
                    <select id="productionLine" name="production_line">
                        <option value="Line 1">{{ t.line_1 }}</option>
                        <option value="Line 2">{{ t.line_2 }}</option>
                    </select>
                </div>
                
                <!-- Shift -->
                <div class="form-group">
                    <label>{{ t.shift }}</label>
                    <select id="shift" name="shift">
                        <option value="Morning">{{ t.morning }}</option>
                        <option value="Evening">{{ t.evening }}</option>
                        <option value="Night">{{ t.night }}</option>
                    </select>
                </div>
                
                <!-- Operator -->
                <div class="form-group">
                    <label>{{ t.operator_name }}</label>
                    <input type="text" id="operator" name="operator" 
                           placeholder="{{ t.operator_name }}">
                </div>
                
                <!-- Notes -->
                <div class="form-group">
                    <label>{{ t.notes }}</label>
                    <input type="text" id="notes" name="notes" 
                           placeholder="{{ t.optional_notes }}">
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;">
                <button type="button" class="btn-secondary" onclick="resetForm()">
                    🔄 {{ t.reset }}
                </button>
                <button type="submit" class="btn-primary">
                    💾 {{ t.save_production }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let currentBagWeight = 0;
let currentBagCount = 0;
let currentTotalWeight = 0;

// Translation strings
const translations = {
    online: "{{ t.online }}",
    offline: "{{ t.offline }}",
    checking: "{{ t.checking }}"
};

// Update scale display
function updateScale() {
    fetch('/api/packing-scale')
        .then(r => r.json())
        .then(data => {
            // Update status
            const statusEl = document.getElementById('scaleStatus');
            if (data.online) {
                statusEl.className = 'status-badge status-online';
                statusEl.innerHTML = '🟢 ' + translations.online;
            } else {
                statusEl.className = 'status-badge status-offline';
                statusEl.innerHTML = '🔴 ' + translations.offline;
            }
            
            // Update display values
            document.getElementById('bagWeight').textContent = data.bag_weight || '--';
            document.getElementById('bagCount').textContent = data.bag_count || '--';
            document.getElementById('totalWeight').textContent = data.total_weight || '--';
            
            // Update form inputs
            if (data.online && data.bag_weight > 0) {
                currentBagWeight = data.bag_weight;
                document.getElementById('bagWeightInput').value = data.bag_weight;
            }
            
            if (data.online && data.bag_count > 0) {
                currentBagCount = data.bag_count;
                document.getElementById('bagCountInput').value = data.bag_count;
            }
            
            if (data.online && data.total_weight > 0) {
                currentTotalWeight = data.total_weight;
                document.getElementById('totalWeightInput').value = data.total_weight;
            }
        })
        .catch(err => console.error('Scale error:', err));
}

// Select product quick button
function selectProduct(product) {
    document.getElementById('productType').value = product;
    
    // Update active state
    document.querySelectorAll('.quick-product-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.includes(product)) {
            btn.classList.add('active');
        }
    });
}

// Reset form
function resetForm() {
    document.getElementById('packingForm').reset();
    document.querySelectorAll('.quick-product-btn').forEach(btn => {
        btn.classList.remove('active');
    });
}

// Submit packing record
function submitPacking(event) {
    event.preventDefault();
    
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData);
    
    // Validate
    if (!data.product_type) {
        alert('{{ t.select_product }}');
        return;
    }
    
    if (!data.bag_weight || data.bag_weight <= 0) {
        alert('{{ t.bag_weight }} > 0');
        return;
    }
    
    if (!data.bag_count || data.bag_count <= 0) {
        alert('{{ t.bag_count }} > 0');
        return;
    }
    
    // Submit
    fetch('/api/packing', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            alert('✅ {{ t.save_production }}!');
            resetForm();
        } else {
            alert('❌ Error: ' + (result.error || 'Unknown error'));
        }
    })
    .catch(err => {
        console.error('Submit error:', err);
        alert('❌ Failed to save production record');
    });
}

// Update scale every second
updateScale();
setInterval(updateScale, 1000);
</script>

{% endblock %}
